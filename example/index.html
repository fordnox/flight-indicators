<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>flight-indicators playground</title>
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; background: #15181c; color: #e6e6e6; }
      main { max-width: 1000px; margin: 0 auto; padding: 24px 16px; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; justify-items: center; }
      .controls { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px 24px; margin: 24px 0; }
      label { display: grid; grid-template-columns: 110px 1fr 56px; gap: 8px; align-items: center; font-size: 14px; }
      output { text-align: right; font-variant-numeric: tabular-nums; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
