<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>flight-indicators playground</title>
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; background: #15181c; color: #e6e6e6; }
      main { max-width: 1000px; margin: 0 auto; padding: 24px 16px; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; justify-items: center; }
      .simulate { display: inline-flex; gap: 8px; align-items: center; }
      .controls { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px 24px; margin: 24px 0; }
      .control { display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
      .control-head { display: flex; justify-content: space-between; }
      .control input { width: 100%; margin: 0; }
      output { font-variant-numeric: tabular-nums; color: #9fb3c8; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
